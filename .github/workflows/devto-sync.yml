name: Dev.to Canonical Syndication

on:
  # schedule:
  #   - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syndicate:
    name: Syndicate Articles to Dev.to
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Dev.to Syndicator Engine
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_PUBLISHED: ${{ secrets.DEVTO_PUBLISHED }}
        run: |
          python devto_engine.py

      - name: Commit Syndication State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/devto_history.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(devto): record syndicated publication state [skip ci]"
            git push
          fi

